services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-bancario-api
    environment:
      SECRET_KEY: ${SECRET_KEY:-chave-local-para-desenvolvimento}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    volumes:
      - banco_dados:/app/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sistema-bancario-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  banco_dados:
